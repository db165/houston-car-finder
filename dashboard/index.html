<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houston Car Finder</title>
<style>
:root{
  --bg:#f4f2ee; --card:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e3dfd8;
  --accent:#0b6e4f; --accentSoft:#e2f1ea; --warn:#9a5b00; --warnSoft:#fbf0dc;
  --bad:#a12a2a; --badSoft:#f8e3e3; --chip:#ebe7e0;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141412; --card:#1d1c1a; --ink:#ecebe7; --muted:#9d998f; --line:#2e2c29;
    --accent:#4fc59a; --accentSoft:#173328; --warn:#e3a645; --warnSoft:#33270f;
    --bad:#ef7b7b; --badSoft:#3a1a1a; --chip:#2a2825;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.sub b{color:var(--ink);font-weight:600}
.bar{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{opacity:.6;font-size:12px;margin-left:4px}
.spacer{flex:1}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;background:var(--chip) center/cover no-repeat;position:relative}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card);color:var(--ink)}
.badge.deal{background:var(--accent);color:#fff}
.badge.new{background:#2b59c3;color:#fff}
.badge.drop{background:var(--warn);color:#fff}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:650;font-size:16px}
.priceRow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-size:22px;font-weight:700;letter-spacing:-.02em}
.pct{font-weight:650;color:var(--accent)}
.pct.neg{color:var(--muted)}
.mv{color:var(--muted);font-size:13px}
.specs{display:flex;flex-wrap:wrap;gap:4px}
.spec{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 7px}
.flag{font-size:12.5px;background:var(--warnSoft);color:var(--warn);border-radius:8px;padding:5px 8px}
.flag.bad{background:var(--badSoft);color:var(--bad)}
.vision{font-size:12.5px;background:var(--accentSoft);border-radius:8px;padding:5px 8px}
.links{margin-top:auto;padding-top:6px;display:flex;gap:12px;font-size:13px}
a{color:var(--accent);font-weight:600;text-decoration:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
details{font-size:12.5px;color:var(--muted)}
.status{max-width:1100px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
@media (max-width:420px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Houston Car Finder</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<div class="bar">
  <div class="tabs" id="tabs"></div>
  <span class="spacer"></span>
  <select id="model"><option value="">All models</option></select>
  <select id="sort">
    <option value="deal">Best deal</option>
    <option value="price">Cheapest</option>
    <option value="new">Newest listing</option>
    <option value="miles">Lowest miles</option>
    <option value="year">Newest year</option>
  </select>
</div>
<main id="grid"></main>
<div class="status" id="status"></div>

<script>
const tabs = [
  {key:"deals", label:"Deals", match:r => ["steal","stretch-deal","austin"].includes(r.tier)},
  {key:"budget", label:"Under $6k", match:r => ["steal","budget"].includes(r.tier)},
  {key:"stretch", label:"Stretch", match:r => ["stretch","stretch-deal"].includes(r.tier)},
  {key:"austin", label:"Austin", match:r => r.tier === "austin"},
  {key:"rejected", label:"Filtered out", match:r => r.tier === "rejected" && r.rejected?.[0] !== "over stretch budget"},
];
let state = {tab:"deals", model:"", sort:"deal"};
let rows = [];
const fmt = n => n == null ? "?" : n.toLocaleString("en-US");
const ago = t => { const h = (Date.now()/1000 - t)/3600; return h < 1 ? "just now" : h < 24 ? `${Math.round(h)}h ago` : `${Math.round(h/24)}d ago`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(r){
  const a = r.appraisal || {};
  const pct = a.dealPct;
  const now = Date.now()/1000;
  const badges = [];
  if (r.tier === "steal" || r.tier === "stretch-deal" || r.tier === "austin") badges.push(`<span class="badge deal">${r.tier === "austin" ? "Austin steal" : "Deal"}</span>`);
  if (now - r.firstSeen < 86400) badges.push(`<span class="badge new">New</span>`);
  const hist = r.priceHistory || [];
  if (hist.length > 1 && hist[hist.length-1][1] < hist[0][1]) badges.push(`<span class="badge drop">Dropped $${fmt(hist[0][1] - hist[hist.length-1][1])}</span>`);
  badges.push(`<span class="badge">${r.source === "cargurus" ? "Dealer · CarGurus" : (r.sellerType === "dealer" ? "Dealer" : "Private") + " · Craigslist"}</span>`);
  const specs = [
    r.miles != null ? `${fmt(r.miles)} mi` : "miles ?",
    r.distance != null ? `${r.distance} mi away` : (r.city || r.region),
    r.mpg ? `${Math.round(r.mpg)} mpg` : null,
    r.cylinders ? `${r.cylinders}-cyl` : null,
    r.drive ? r.drive.toUpperCase() : null,
    `listed ${ago(r.firstSeen)}`,
  ].filter(Boolean).map(s => `<span class="spec">${esc(s)}</span>`).join("");
  const flags = (r.flags || []).map(f => `<div class="flag">⚠ ${esc(f)}</div>`).join("")
    + (r.rejected || []).map(f => `<div class="flag bad">✕ ${esc(f)}</div>`).join("");
  const v = r.vision && !r.vision.error && r.vision.photosUseful !== false
    ? `<div class="vision">📷 Paint ${esc(r.vision.paint)}, body ${esc(r.vision.body)}, rust ${esc(r.vision.rust)}. ${esc(r.vision.notes || "")}</div>` : "";
  const vinLink = r.vin && r.vin.length === 17
    ? `<a href="https://www.nicb.org/vincheck" target="_blank" rel="noopener" title="Paste ${esc(r.vin)} for a free flood/theft check" onclick="navigator.clipboard?.writeText('${esc(r.vin)}')">Flood check (copies VIN)</a>` : "";
  return `<article class="card">
    <div class="photo" style="background-image:url('${esc((r.photos||[])[0] || "")}')"><div class="badges">${badges.join("")}</div></div>
    <div class="body">
      <div class="name">${esc(r.year)} ${esc(r.make)} ${esc(r.model)} <span class="mv">${esc(r.trim || "")}</span></div>
      <div class="priceRow"><span class="price">$${fmt(r.price)}</span>
        ${pct != null ? `<span class="pct ${pct < 0 ? "neg" : ""}">${pct >= 0 ? Math.round(pct*100) + "% under" : Math.round(-pct*100) + "% over"}</span>` : ""}
        ${a.marketValue ? `<span class="mv">market ~$${fmt(a.marketValue)} · ${esc(a.confidence)}</span>` : ""}</div>
      <div class="specs">${specs}</div>
      ${v}${flags}
      ${r.description ? `<details><summary>Seller's description</summary>${esc(r.description)}</details>` : ""}
      <div class="links"><a href="${esc(r.url)}" target="_blank" rel="noopener">Open listing</a>${vinLink}</div>
    </div></article>`;
}

function render(){
  const active = rows.filter(r => r.active);
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="${state.tab === t.key ? "on" : ""}" data-tab="${t.key}">${t.label}<span class="count">${active.filter(t.match).length}</span></button>`).join("");
  const tab = tabs.find(t => t.key === state.tab);
  let list = active.filter(tab.match).filter(r => !state.model || r.model === state.model);
  const key = {
    deal: r => -(r.appraisal?.dealPct ?? -9),
    price: r => r.price, new: r => -r.firstSeen, miles: r => r.miles ?? 1e9, year: r => -(r.year || 0),
  }[state.sort];
  list.sort((a, b) => key(a) - key(b));
  document.getElementById("grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">Nothing here right now. The finder checks every 10 minutes.</div>`;
}

document.getElementById("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { state.tab = b.dataset.tab; render(); } };
document.getElementById("model").onchange = e => { state.model = e.target.value; render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };

fetch("data.json?t=" + Date.now()).then(r => r.json()).then(d => {
  rows = d.listings || [];
  const models = [...new Set(rows.map(r => r.model).filter(Boolean))].sort();
  document.getElementById("model").innerHTML += models.map(m => `<option>${esc(m)}</option>`).join("");
  const active = rows.filter(r => r.active && r.tier !== "rejected").length;
  document.getElementById("sub").innerHTML = `Tracking <b>${active}</b> cars within 50 mi of Rice · updated <b>${ago(d.updatedAt)}</b>`;
  const src = Object.entries(d.sources || {}).map(([k, v]) => `${k}: ${v}`).join(" · ");
  const fits = Object.entries(d.fits || {}).map(([m, f]) => `${m} ${f ? f.n + " comps" : "no comps yet"}`).join(" · ");
  document.getElementById("status").innerHTML = `Sources: ${esc(src)}<br>Pricing data: ${esc(fits)}`;
  if (!rows.some(r => r.active && tabs[0].match(r))) state.tab = "budget";
  render();
}).catch(() => { document.getElementById("sub").textContent = "No data yet. The first crawl hasn't finished."; });
</script>
</body>
</html>
